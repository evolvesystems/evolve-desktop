[package]
name = "evolve-desktop"
version = "2.4.20"
description = "EvolveApp - Desktop wrapper for evolvepreneuriq.app"
authors = ["EvolveApp Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.2", features = ["tray-icon", "unstable"] }
tauri-plugin-shell = "2.2"
tauri-plugin-http = "2.2"
tauri-plugin-deep-link = "2.2"
tauri-plugin-updater = "2.2"
tauri-plugin-notification = "2.2"
tauri-plugin-global-shortcut = "2"
# Pinned: rust-ini 0.21.3 added fields to ParseOption, which breaks tauri-plugin-deep-link 2.6.2 on Linux
# (E0063 in its src/lib.rs). Not used directly; this only constrains the dependency resolution.
rust-ini = "=0.21.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
